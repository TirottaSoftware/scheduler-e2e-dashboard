<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP E2E Session Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="header-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm-1 2.5v4l3.5 2-.5.87L6.5 9.5V5H7z" fill="currentColor"/>
        </svg>
      </div>
      <span class="header-title">E2E Sessions</span>
    </div>
    <button class="btn-clear" id="clearBtn">Clear all</button>
  </header>

  <div class="sessions" id="sessionsList">
    <!-- populated by popup.js -->
  </div>

  <footer class="footer">
    <a href="https://tirottasoftware.github.io/scheduler-e2e-dashboard/" target="_blank">Open Dashboard</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
